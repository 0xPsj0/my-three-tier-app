apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-three-tier-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0xPsj0/my-three-tier-app.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: 3-tier-website-ns
    syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true